<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — DIGILEX HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body style="background:var(--dlx-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">

  <div style="width:100%;max-width:400px">
    <div style="text-align:center;margin-bottom:24px">
      <div class="brand-mark" style="width:52px;height:52px;font-size:1.4rem;margin:0 auto 12px">D</div>
      <div style="color:#fff;font-weight:800;font-size:1.3rem;letter-spacing:.03em">DIGILEX HR</div>
      <div style="color:#94A3B8;font-size:.82rem;margin-top:2px">Sign in to your account</div>
    </div>

    <div class="dlx-card">
      <form id="login-form">
        <div class="field-group">
          <label class="field-label">Your Name or Employee ID</label>
          <input class="field-input" id="login-username" placeholder="e.g. Maria Santos" autocomplete="username" required>
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <input type="password" class="field-input" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div id="login-error" style="display:none;color:var(--dlx-danger);font-size:.8rem;margin-bottom:14px"></div>
        <div id="login-mode-note" style="display:none;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:8px 10px;font-size:.75rem;margin-bottom:14px"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
      </form>
    </div>

    <div class="dlx-card" style="margin-top:14px;background:#F8FAFC">
      <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#64748B;margin-bottom:8px">Demo accounts</div>
      <div style="font-size:.8rem;color:#475569;line-height:1.6">
        Sign in with your <strong>name</strong> (e.g. <code>Maria Santos</code>) or your Employee ID.<br>
        Default password for everyone: <code>digilex123</code> — change it after your first sign-in.
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  (function () {
    var existing = DigilexAuth.getSession();
    if (existing) { location.href = DigilexAuth.landingPageFor(existing.role); return; }

    var form = document.getElementById("login-form");
    var errEl = document.getElementById("login-error");
    var submitBtn = form.querySelector("button[type=submit]");
    var originalBtn = submitBtn.innerHTML;

    // Tell people plainly which copy of the data they're signing into,
    // instead of silently falling back and leaving them puzzled when a
    // colleague's clock-in doesn't show up.
    var reason = window.DigilexSupabase && window.DigilexSupabase.unavailableReason();
    if (reason) {
      var note = document.getElementById("login-mode-note");
      if (note) {
        note.textContent = "Offline mode — " + reason + " Data stays on this device only.";
        note.style.display = "block";
      }
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      errEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in…';

      var username = document.getElementById("login-username").value;
      var password = document.getElementById("login-password").value;

      DigilexAuth.cloudLogin(username, password).then(function (result) {
        if (!result.ok) {
          errEl.textContent = result.error;
          errEl.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtn;
          return;
        }
        location.href = DigilexAuth.landingPageFor(result.role);
      });
    });
  })();
</script>
</body>
</html>
