<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recruitment — DIGILEX HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="header-root"></div>
    <div class="page-body">

      <div id="recruit-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px"></div>

      <div style="font-weight:700;margin-bottom:10px">Open Positions</div>
      <div id="recruit-positions" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:24px"></div>

      <div style="font-weight:700;margin-bottom:10px">Applicant Tracker</div>
      <div class="kanban-wrap" id="recruit-kanban"></div>

    </div>
  </div>
</div>

<!-- Convert to Employee Modal -->
<div class="modal-backdrop" id="convert-modal" data-modal-id="convert-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Convert to Employee</div>
      <button class="modal-close" data-modal-close="convert-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="convert-form">
      <input type="hidden" id="cvt-form-applicant">
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="field-group"><label class="field-label">First Name</label><input class="field-input" id="cvt-f-firstName" required></div>
          <div class="field-group"><label class="field-label">Last Name</label><input class="field-input" id="cvt-f-lastName" required></div>
          <div class="field-group" style="grid-column:1/-1"><label class="field-label">Position</label><input class="field-input" id="cvt-f-position" required></div>
          <div class="field-group">
            <label class="field-label">Department</label>
            <select class="field-select" id="cvt-f-department">
              <option>Executives</option><option>Admin</option><option>Sales & Marketing</option>
              <option selected>Customer Service</option><option>Warehouse</option><option>Logistics</option><option>Business Development</option>
            </select>
          </div>
          <div class="field-group"><label class="field-label">Monthly Salary (₱)</label><input type="number" min="0" class="field-input" id="cvt-f-salary"></div>
          <div class="field-group"><label class="field-label">Date Hired</label><input type="date" class="field-input" id="cvt-f-dateHired"></div>
          <div class="field-group"><label class="field-label">Contact Number</label><input class="field-input" id="cvt-f-contact"></div>
          <div class="field-group" style="grid-column:1/-1"><label class="field-label">Personal Email</label><input type="email" class="field-input" id="cvt-f-email"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-modal-close="convert-modal">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Create Employee Record</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/recruitment.js"></script>
</body>
</html>
