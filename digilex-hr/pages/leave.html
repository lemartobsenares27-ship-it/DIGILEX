<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave Management — DIGILEX HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="header-root"></div>
    <div class="page-body">

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;margin-bottom:16px">
        <div class="dlx-card" style="min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div style="font-weight:700">Leave Requests</div>
            <span class="badge badge-yellow" id="lv-pending-badge">0 pending</span>
          </div>
          <div style="overflow-x:auto">
            <table class="dlx-table">
              <thead><tr><th>Employee</th><th>Leave Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="lv-requests-body"></tbody>
            </table>
          </div>
        </div>

        <div class="dlx-card">
          <div style="font-weight:700;margin-bottom:12px"><i class="fa-solid fa-plane-departure"></i> New Leave Request</div>
          <form id="lv-form">
            <div class="field-group"><label class="field-label">Employee</label><select class="field-select" id="lv-employee" required></select></div>
            <div class="field-group"><label class="field-label">Leave Type</label><select class="field-select" id="lv-type" required></select></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div class="field-group"><label class="field-label">Date From</label><input type="date" class="field-input" id="lv-date-from" required></div>
              <div class="field-group"><label class="field-label">Date To</label><input type="date" class="field-input" id="lv-date-to" required></div>
            </div>
            <div style="font-size:.8rem;color:#64748B;margin-bottom:14px">Days requested: <strong id="lv-days-display">0 day(s)</strong></div>
            <div class="field-group"><label class="field-label">Reason</label><textarea class="field-textarea" id="lv-reason" rows="3"></textarea></div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center"><i class="fa-solid fa-paper-plane"></i> Submit Request</button>
          </form>
        </div>
      </div>

      <div class="dlx-card" style="margin-bottom:16px">
        <div style="font-weight:700;margin-bottom:12px">Leave Balance Tracker</div>
        <div id="lv-balances" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px"></div>
      </div>

      <div class="dlx-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div style="font-weight:700">Leave Calendar</div>
          <div style="display:flex;align-items:center;gap:10px">
            <button class="btn btn-secondary btn-sm" id="lv-cal-prev"><i class="fa-solid fa-chevron-left"></i></button>
            <div id="lv-cal-label" style="font-weight:600;min-width:120px;text-align:center"></div>
            <button class="btn btn-secondary btn-sm" id="lv-cal-next"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.7rem;font-weight:700;color:#94A3B8;text-align:center;margin-bottom:6px">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="lv-calendar-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div>
      </div>

    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/leave.js"></script>
</body>
</html>
