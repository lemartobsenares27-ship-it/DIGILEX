<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Attendance — DIGILEX HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body style="background:var(--dlx-bg)">

  <header class="topbar" style="padding-left:24px;padding-right:24px">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="brand-mark">D</div>
      <div>
        <div style="font-weight:800;color:var(--dlx-primary)">DIGILEX HR</div>
        <div style="font-size:.72rem;color:#94A3B8">Employee Self-Service</div>
      </div>
    </div>
    <div class="topbar-right">
      <div style="text-align:right">
        <div id="portal-name" style="font-weight:700;font-size:.85rem"></div>
        <div id="portal-role" style="font-size:.72rem;color:#94A3B8"></div>
      </div>
      <div class="avatar avatar-sm" id="portal-avatar"></div>
      <button class="btn btn-secondary btn-sm" id="btn-portal-change-password"><i class="fa-solid fa-key"></i> Change Password</button>
      <button class="btn btn-secondary btn-sm" id="btn-portal-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <div class="page-body" style="max-width:900px;margin:0 auto">

    <div class="dlx-card" style="margin-bottom:16px;text-align:center">
      <div id="portal-today-date" style="color:#64748B;font-size:.85rem;margin-bottom:14px"></div>
      <div id="portal-clock-status" style="font-size:1.1rem;font-weight:700;margin-bottom:20px"></div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="btn-time-in" style="min-width:160px;justify-content:center"><i class="fa-solid fa-right-to-bracket"></i> Time In</button>
        <button class="btn btn-secondary" id="btn-time-out" style="min-width:160px;justify-content:center"><i class="fa-solid fa-right-from-bracket"></i> Time Out</button>
      </div>
    </div>

    <div id="portal-summary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:16px"></div>

    <div class="dlx-card">
      <div style="font-weight:700;margin-bottom:12px">My Attendance History</div>
      <div style="overflow-x:auto">
        <table class="dlx-table">
          <thead><tr><th>Date</th><th>Status</th><th>Time In</th><th>Time Out</th><th>Hours</th></tr></thead>
          <tbody id="portal-history-body"></tbody>
        </table>
      </div>
    </div>

  </div>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/portal.js"></script>
</body>
</html>
