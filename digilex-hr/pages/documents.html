<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Documents — DIGILEX HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="header-root"></div>
    <div class="page-body">

      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <div style="font-weight:700;font-size:1.05rem" id="doc-count">0 documents</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <select id="doc-filter-category" class="field-select" style="max-width:210px"></select>
          <button class="btn btn-primary" id="btn-upload-doc"><i class="fa-solid fa-upload"></i> Upload Document</button>
        </div>
      </div>

      <div class="dlx-card" style="padding:0;overflow-x:auto">
        <table class="dlx-table">
          <thead><tr><th>Name</th><th>Category</th><th>Date Uploaded</th><th>Uploaded By</th><th>Actions</th></tr></thead>
          <tbody id="doc-body"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal-backdrop" id="upload-modal" data-modal-id="upload-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Upload Document</div>
      <button class="modal-close" data-modal-close="upload-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="upload-form">
      <div class="modal-body">
        <div class="field-group"><label class="field-label">File Name</label><input class="field-input" id="doc-f-name" placeholder="e.g. Updated Employee Handbook v2.0" required></div>
        <div class="field-group"><label class="field-label">Category</label><select class="field-select" id="doc-f-category"></select></div>
        <div style="font-size:.75rem;color:#94A3B8"><i class="fa-solid fa-circle-info"></i> This is a demo file library — no actual file bytes are stored.</div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-modal-close="upload-modal">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-upload"></i> Upload</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-backdrop" id="delete-modal" data-modal-id="delete-modal">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-head">
      <div class="modal-title">Delete Document</div>
      <button class="modal-close" data-modal-close="delete-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">Are you sure you want to delete "<strong id="delete-doc-name"></strong>"? This cannot be undone.</div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-modal-close="delete-modal">Cancel</button>
      <button type="button" class="btn btn-danger" id="btn-confirm-delete"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script>DigilexAuth.requireRole("admin");</script>
<script src="../js/app.js"></script>
<script src="../js/documents.js"></script>
</body>
</html>
