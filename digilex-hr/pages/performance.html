<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Performance — DIGILEX HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="header-root"></div>
    <div class="page-body">

      <div style="margin-bottom:16px">
        <div class="view-toggle">
          <button id="btn-view-employee" class="active">Employee Scorecards</button>
          <button id="btn-view-department">Department Scorecards</button>
          <button id="btn-view-weekly">Weekly Scoreboard</button>
        </div>
      </div>

      <div id="perf-employee-view">
        <div class="dlx-card" style="padding:0;overflow-x:auto">
          <table class="dlx-table">
            <thead><tr><th>Employee</th><th>Attendance Rate</th><th>Punctuality</th><th>This Month</th><th>Last Month</th><th>Trend</th><th>Actions</th></tr></thead>
            <tbody id="perf-body"></tbody>
          </table>
        </div>
      </div>

      <div id="perf-department-view" style="display:none">
        <div id="dept-scorecards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px"></div>
      </div>

      <div id="perf-weekly-view" style="display:none">
        <div class="dlx-card" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
            <div style="display:flex;align-items:center;gap:10px">
              <button class="btn btn-secondary btn-sm" id="btn-week-prev"><i class="fa-solid fa-chevron-left"></i></button>
              <div id="week-range-label" style="font-weight:700;min-width:220px;text-align:center"></div>
              <button class="btn btn-secondary btn-sm" id="btn-week-next"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <button class="btn btn-secondary btn-sm" id="btn-week-thisweek">This Week</button>
          </div>
        </div>

        <div id="weekly-kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px"></div>

        <div class="dlx-card" style="margin-bottom:16px">
          <div style="font-weight:700;margin-bottom:12px">Department Breakdown</div>
          <div style="overflow-x:auto">
            <table class="dlx-table">
              <thead><tr><th>Department</th><th>Headcount</th><th>Present</th><th>Late</th><th>Absent</th><th>Attendance Rate</th></tr></thead>
              <tbody id="weekly-dept-body"></tbody>
            </table>
          </div>
        </div>

        <div class="dlx-card">
          <div style="font-weight:700;margin-bottom:4px"><i class="fa-solid fa-triangle-exclamation" style="color:#EF4444"></i> Needs Attention</div>
          <div style="font-size:.78rem;color:#94A3B8;margin-bottom:12px">Employees with an attendance rate below 75% or 2+ absences this week.</div>
          <div id="weekly-attention-list"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Scorecard Modal -->
<div class="modal-backdrop" id="perf-modal" data-modal-id="perf-modal">
  <div class="modal-box" id="perf-modal-box">
    <div class="modal-head">
      <div class="modal-title" id="perf-modal-title">Scorecard</div>
      <button class="modal-close" data-modal-close="perf-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="perf-form">
      <input type="hidden" id="perf-form-employee"><input type="hidden" id="perf-form-month">
      <div class="modal-body">

        <div id="perf-kpi-container" style="display:none"></div>

        <div id="perf-generic-fields">
          <div class="field-group"><label class="field-label">Tasks Completed (0–100)</label><input type="number" min="0" max="100" class="field-input" id="perf-f-tasks"></div>
          <div class="field-group"><label class="field-label">Quality Score (1–10)</label><input type="number" min="1" max="10" step="0.1" class="field-input" id="perf-f-quality"></div>
          <div class="field-group" id="perf-csat-wrap"><label class="field-label">Customer Satisfaction (1–5)</label><input type="number" min="1" max="5" step="0.1" class="field-input" id="perf-f-csat"></div>
          <div class="field-group" id="perf-orders-wrap"><label class="field-label">Orders Processed</label><input type="number" min="0" class="field-input" id="perf-f-orders"></div>
        </div>

        <div class="field-group"><label class="field-label">Manager Notes</label><textarea class="field-textarea" id="perf-f-notes" rows="3"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-modal-close="perf-modal">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Scorecard</button>
      </div>
    </form>
  </div>
</div>

<!-- History Modal -->
<div class="modal-backdrop" id="history-modal" data-modal-id="history-modal">
  <div class="modal-box modal-lg">
    <div class="modal-head">
      <div class="modal-title" id="history-modal-title">Performance History</div>
      <button class="modal-close" data-modal-close="history-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <canvas id="history-chart" height="120"></canvas>
      <div style="font-weight:700;margin:16px 0 8px">Manager Notes History</div>
      <div id="history-notes"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script>DigilexAuth.requireRole("admin");</script>
<script src="../js/app.js"></script>
<script src="../js/performance.js"></script>
</body>
</html>
