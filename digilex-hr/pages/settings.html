<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — DIGILEX HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="header-root"></div>
    <div class="page-body">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">
        <div class="dlx-card">
          <div style="font-weight:700;margin-bottom:14px">Company Information</div>
          <form id="settings-form">
            <div class="field-group"><label class="field-label">Company Name</label><input class="field-input" id="set-company-name"></div>
            <div class="field-group"><label class="field-label">Company Address</label><input class="field-input" id="set-company-address"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div class="field-group"><label class="field-label">Payroll Cutoff Day 1</label><input type="number" min="1" max="31" class="field-input" id="set-cutoff-1"></div>
              <div class="field-group"><label class="field-label">Payroll Cutoff Day 2</label><input type="number" min="1" max="31" class="field-input" id="set-cutoff-2"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div class="field-group"><label class="field-label">Work Hours Start</label><input type="time" class="field-input" id="set-hours-start"></div>
              <div class="field-group"><label class="field-label">Work Hours End</label><input type="time" class="field-input" id="set-hours-end"></div>
            </div>
            <div class="field-group">
              <label class="field-label">Rest Days</label>
              <div id="set-restdays" style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:8px"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button>
          </form>
        </div>

        <div class="dlx-card">
          <div style="font-weight:700;margin-bottom:14px">Danger Zone</div>
          <p style="font-size:.85rem;color:#64748B;margin-bottom:14px">Reset all app data (employees, attendance, payroll, leave requests, performance, recruitment, documents) back to the original DIGILEX demo dataset. This cannot be undone.</p>
          <button class="btn btn-danger" id="btn-reset-demo"><i class="fa-solid fa-arrow-rotate-left"></i> Reset to Demo Data</button>
        </div>
      </div>

      <div class="dlx-card" style="margin-top:16px">
        <div style="font-weight:700;margin-bottom:14px">Philippine Public Holidays</div>
        <form id="holiday-form" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px">
          <div class="field-group" style="margin-bottom:0"><label class="field-label">Date</label><input type="date" class="field-input" id="hol-f-date" required></div>
          <div class="field-group" style="margin-bottom:0"><label class="field-label">Name</label><input class="field-input" id="hol-f-name" required></div>
          <div class="field-group" style="margin-bottom:0">
            <label class="field-label">Type</label>
            <select class="field-select" id="hol-f-type"><option>Regular</option><option>Special</option></select>
          </div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Holiday</button>
        </form>
        <div style="overflow-x:auto">
          <table class="dlx-table">
            <thead><tr><th>Date</th><th>Name</th><th>Type</th><th>Actions</th></tr></thead>
            <tbody id="set-holidays-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script>DigilexAuth.requireRole("admin");</script>
<script src="../js/app.js"></script>
<script src="../js/settings.js"></script>
</body>
</html>
